<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mswrite Editor</title>
<link rel="stylesheet" href="vditor/dist/index.css">
<link id="msThemeCss" rel="stylesheet" href="themes/light.css">
<link id="vditorKatexStyle" rel="stylesheet" href="vditor/dist/js/katex/katex.min.css">
<style>
    html, body { margin: 0; padding: 0; height: 100%; }
    #vd { height: 100%; }
    /* 文档末尾呼吸空间:最后一行下面留出约 1/5 视口,
       光标在文末打字不再贴着窗口底边"踩钢丝"。
       必须 min-height 而不是 Vditor 默认的 height:100% —— 固定高度下
       内容是溢出渲染的,padding 落在盒子底而文字早已越过,留白进不了滚动区 */
    .vditor-ir pre.vditor-reset {
        min-height: 100% !important;
        height: auto !important;
        padding-bottom: 20vh !important;
    }
    /* 隐藏 Vditor 自带工具栏(由原生菜单承担) */
    .vditor-toolbar { display: none !important; }
    /* 只保留【一个】滚动容器:Vditor 给 .vditor-reset 设了 overflow:auto,
       而窗口(内容溢出)也在滚 —— 两条滚动条同时出现,滚轮与光标跟随
       还会在两层之间打架。让 reset 不滚,统一由窗口滚 */
    .vditor-ir pre.vditor-reset {
        overflow: visible !important;
    }
    /* Keep a clickable line when Enter creates an empty paragraph. */
    .vditor-ir pre.vditor-reset p:empty { min-height: 1.75em; }
    /* 隐藏代码块的"复制"悬浮按钮:Typora 没有它,且它带一个 textarea,
       在空代码块上会占据整块、看起来像一团莫名其妙的灰块 */
    .vditor-copy { display: none !important; }
    .vditor { border: 0 !important; border-radius: 0 !important; }
    .vditor-content { background: transparent !important; }

    /* 字号(由宿主 setFontSize 调整) */
    .vditor-reset { font-size: var(--ms-font-size, 16px); }

    /* 专注模式:淡化非当前块(块在 pre.vditor-reset 内,不在 .vditor-ir 直接子级) */
    body.ms-focus .vditor-ir pre.vditor-reset > *,
    body.ms-focus .vditor-wysiwyg pre.vditor-reset > * {
        opacity: 0.22;
        transition: opacity 0.25s ease;
    }
    body.ms-focus .vditor-ir pre.vditor-reset > .ms-active-block,
    body.ms-focus .vditor-wysiwyg pre.vditor-reset > .ms-active-block {
        opacity: 1;
    }

    /* 标题标记(# 与 H1~H6 徽标)默认全部隐藏,只有被鼠标点过的那一个标题
       显示(ms-show-marker 由 bridge.js 的 mousedown 监听维护)。
       注意:不能挂 Vditor 的 --expand 类 —— Ctrl+1~6 之后光标留在标题里,
       Vditor 会自动加 --expand,# 号立刻冒出来。与光标解耦、只认点击,
       才是 Typora 式的干净排版。仅视觉隐藏,data-marker 与标记文本仍在
       DOM 里,markdown 往返不受影响 */
    .vditor-ir h1::before,
    .vditor-ir h2::before,
    .vditor-ir h3::before,
    .vditor-ir h4::before,
    .vditor-ir h5::before,
    .vditor-ir h6::before {
        content: none !important;
    }
    .vditor-ir h1 .vditor-ir__marker--heading,
    .vditor-ir h2 .vditor-ir__marker--heading,
    .vditor-ir h3 .vditor-ir__marker--heading,
    .vditor-ir h4 .vditor-ir__marker--heading,
    .vditor-ir h5 .vditor-ir__marker--heading,
    .vditor-ir h6 .vditor-ir__marker--heading {
        display: none !important;
    }
    .vditor-ir h1.ms-show-marker::before { content: 'H1' !important; }
    .vditor-ir h2.ms-show-marker::before { content: 'H2' !important; }
    .vditor-ir h3.ms-show-marker::before { content: 'H3' !important; }
    .vditor-ir h4.ms-show-marker::before { content: 'H4' !important; }
    .vditor-ir h5.ms-show-marker::before { content: 'H5' !important; }
    .vditor-ir h6.ms-show-marker::before { content: 'H6' !important; }
    .vditor-ir h1.ms-show-marker .vditor-ir__marker--heading,
    .vditor-ir h2.ms-show-marker .vditor-ir__marker--heading,
    .vditor-ir h3.ms-show-marker .vditor-ir__marker--heading,
    .vditor-ir h4.ms-show-marker .vditor-ir__marker--heading,
    .vditor-ir h5.ms-show-marker .vditor-ir__marker--heading,
    .vditor-ir h6.ms-show-marker .vditor-ir__marker--heading {
        display: inline !important;
    }

    /* 代码块:对齐 Typora —— 一张卡片,左侧行号,语法高亮。
       围栏 ``` / 折叠时空格在展开时看起来像上下的 "...",一律去掉。 */
    .vditor-ir div[data-type="code-block"],
    .vditor-ir .vditor-ir__node[data-type="code-block"] {
        position: relative;
        margin: 8px 0;
        background: var(--code-background, #f6f8fa);
        border-radius: 6px;
        overflow: hidden;
    }
    .vditor-ir div[data-type="code-block"]::before,
    .vditor-ir div[data-type="code-block"]::after,
    .vditor-ir .vditor-ir__node[data-type="code-block"]::before,
    .vditor-ir .vditor-ir__node[data-type="code-block"]::after,
    .vditor-ir .vditor-ir__node--expand[data-type="code-block"]::before,
    .vditor-ir .vditor-ir__node--expand[data-type="code-block"]::after {
        content: none !important;
        display: none !important;
    }
    .vditor-ir div[data-type="code-block"] > span,
    .vditor-ir div[data-type="code-block"] span[data-type="code-block-open-marker"],
    .vditor-ir div[data-type="code-block"] span[data-type="code-block-close-marker"],
    .vditor-ir div[data-type="code-block"] pre.vditor-ir__marker--pre,
    .vditor-ir div[data-type="code-block"] .vditor-ir__marker--info {
        display: none !important;
    }
    .vditor-ir div[data-type="code-block"] pre.vditor-ir__preview {
        margin: 0;
        padding: 12px 16px 12px 0 !important;
        background: transparent !important;
        border-radius: 0;
        white-space: pre !important;
        overflow-x: auto;
    }
    /* hljs 主题 CSS 给 pre code.hljs 塞了 padding:1em,会把正文往右下顶,
       行号立刻错位 —— 统一清零后由我们自己给左槽留白。
       max-height 必须压掉:Vditor 会给长代码块写内联
       max-height = 窗口高-40,代码被内部滚动条截断、行号却继续往下排,
       写到底部也不跟随滚动 —— 长文档"代码区空白"的根源 */
    .vditor-ir div[data-type="code-block"] pre.vditor-ir__preview code {
        display: block;
        white-space: pre !important;
        background: transparent !important;
        padding: 0 !important;
        padding-left: 40px !important;
        max-height: none !important;
        overflow-y: visible !important;
    }
    /* 编辑态显示切换完全跟随 Vditor 自己的 --expand 类。
       不能用我们自己的类抢先切换 marker/preview 的 display ——
       Vditor 的点击处理是异步的,它在旧布局上算 Range,布局被我们
       提前改掉后它会删错位置(实测:标题掉尾字、围栏被吞、块退化)。
       我们只做外观修饰,布局控制权归 Vditor */
    .vditor-ir div[data-type="code-block"].vditor-ir__node--expand {
        background: var(--code-background, #f6f8fa);
        overflow: hidden;
        position: relative;
    }
    .vditor-ir div[data-type="code-block"].vditor-ir__node--expand pre.vditor-ir__marker--pre {
        display: block !important;
        /* Vditor 基础规则把 marker 压成 width:0;height:0;overflow:hidden,
           --expand 才展开;这里显式放开宽高,防止展开时序差 */
        width: auto !important;
        height: auto !important;
        position: relative;
        z-index: 2;
        padding: 12px 16px 12px 40px !important;
        margin: 0;
        background: transparent !important;
        min-height: 1.5em;
        overflow-x: auto;
        /* 行高必须与阅读态(preview,继承 .vditor-reset 的 1.75)完全一致:
           两态行高不同的话,点击位置映射到编辑态会错行,块高度也会跳变,
           表现为"点哪里光标不在哪里、滚动乱跳" */
        line-height: inherit !important;
        tab-size: 4;
    }
    .vditor-ir div[data-type="code-block"].vditor-ir__node--expand pre.vditor-ir__marker--pre,
    .vditor-ir div[data-type="code-block"].vditor-ir__node--expand pre.vditor-ir__marker--pre code {
        color: var(--textarea-text-color, #24292e);
        caret-color: var(--textarea-text-color, #24292e);
        white-space: pre;
    }
    /* Vditor 给 .vditor-reset pre>code 塞了 padding(0.2~0.5em),编辑态
       源码文字会整体右下偏移,行号和高亮列随之错位 —— 必须清零。
       max-height 同理压掉(长代码块被截断的另一个入口) */
    .vditor-ir div[data-type="code-block"] pre.vditor-ir__marker--pre code {
        padding: 0 !important;
        margin: 0 !important;
        border-radius: 0 !important;
        max-height: none !important;
    }
    /* 无行号模式(MarkText 式纯代码卡片):左槽从 40px 收到 16px,
       代码贴卡片左缘;行号列本身在 JS 层完全不生成 */
    body.ms-no-lineno .vditor-ir div[data-type="code-block"] pre.vditor-ir__preview code {
        padding-left: 16px !important;
    }
    body.ms-no-lineno .vditor-ir div[data-type="code-block"].vditor-ir__node--expand
        pre.vditor-ir__marker--pre {
        padding: 12px 16px !important;
    }
    /* 编辑态高亮列就绪(ms-cb-hi-ready)后源码文字透明、光标保留。
       点击落点永远是真实文字;选区背景照常渲染,透明文字不碍事 */
    .vditor-ir div[data-type="code-block"].ms-cb-hi-ready pre.vditor-ir__marker--pre,
    .vditor-ir div[data-type="code-block"].ms-cb-hi-ready pre.vditor-ir__marker--pre code {
        color: transparent !important;
        caret-color: var(--textarea-text-color, #24292e) !important;
        -webkit-text-fill-color: transparent;
    }
    .vditor-ir div[data-type="code-block"].vditor-ir__node--expand pre.vditor-ir__preview {
        display: none !important;
    }
    .vditor-ir div[data-type="code-block"].ms-lang-editing {
        padding-bottom: 38px;
    }
    .vditor-ir div[data-type="code-block"].ms-lang-editing .vditor-ir__marker--info {
        display: inline-block !important;
        width: auto !important;
        height: auto !important;
        position: absolute;
        right: 12px;
        bottom: 7px;
        min-width: 96px;
        padding: 2px 8px;
        border: 1px solid var(--border-color, #d1d5da);
        border-radius: 4px;
        background: var(--panel-background-color, #fff);
        outline: none;
        z-index: 2;
    }
    #ms-code-lang {
        position: fixed;
        z-index: 80;
        display: flex;
        align-items: center;
        gap: 6px;
        padding: 3px 10px;
        font-size: 12px;
        color: #586069;
        background: rgba(246, 248, 250, 0.96);
        border: 1px solid #e1e4e8;
        border-radius: 4px;
        cursor: pointer;
        user-select: none;
        box-shadow: 0 1px 2px rgba(0, 0, 0, 0.04);
        pointer-events: auto;
    }
    #ms-code-lang .ms-lang-ico {
        width: 14px;
        height: 14px;
        font-size: 8px;
    }
    body[data-ms-theme="dark"] #ms-code-lang {
        color: #c5c5c5;
        background: rgba(37, 37, 38, 0.96);
        border-color: #3c3c3c;
    }
    /* 行号/高亮层:挂在 .vditor-ir 内(contenteditable 之外),
       Lute 读不到,永不污染 markdown;文档流内定位,滚动缩放天然对齐 */
    .ms-gutter-layer {
        position: absolute;
        left: 0;
        top: 0;
        width: 100%;
        height: 100%;
        pointer-events: none;
        z-index: 1;
    }
    .ms-gutter-layer .ms-gutter-col {
        position: absolute;
        width: 32px;
        padding: 0 6px 0 2px;
        box-sizing: border-box;
        text-align: right;
        white-space: pre;
        color: var(--ms-code-lineno, #c0c4c8);
        user-select: none;
        font-variant-numeric: tabular-nums;
    }
    .ms-gutter-layer .ms-gutter-col > span {
        display: block;
    }
    /* 编辑态高亮列:与源码 pre 同字体同行高(JS 逐块复制计算样式),
       点击落点是真实文字本身;列在 z-index 1,真文字 z-index 2 在其上,
       光标与选区始终可见 */
    .ms-gutter-layer .ms-hi-col {
        position: absolute;
        white-space: pre;
        overflow: hidden;
        color: var(--textarea-text-color, #24292e);
    }
    #ms-lang-suggest {
        position: fixed;
        z-index: 12000;
        min-width: 168px;
        max-height: 240px;
        overflow-y: auto;
        padding: 4px 0;
        background: var(--panel-background-color, #fff);
        border: 1px solid var(--border-color, #d1d5da);
        border-radius: 8px;
        box-shadow: 0 8px 24px rgba(0,0,0,.12);
        font-size: 13px;
        color: var(--textarea-text-color, #24292e);
    }
    #ms-lang-suggest[hidden] { display: none !important; }
    .ms-lang-item {
        display: flex;
        align-items: center;
        gap: 8px;
        padding: 6px 12px;
        cursor: pointer;
        user-select: none;
    }
    .ms-lang-item:hover, .ms-lang-item.is-active {
        background: rgba(66, 133, 244, 0.12);
    }
    /* 语言候选底部:本文档默认语言开关(每文档独立) */
    .ms-lang-foot {
        display: flex;
        align-items: center;
        gap: 8px;
        padding: 6px 12px;
        margin-top: 2px;
        border-top: 1px solid var(--border-color, #d1d5da);
        color: #586069;
        font-size: 12px;
        cursor: pointer;
        user-select: none;
    }
    .ms-lang-foot:hover {
        background: rgba(66, 133, 244, 0.08);
        color: #24292e;
    }
    body[data-ms-theme="dark"] .ms-lang-foot {
        color: #9d9d9d;
        border-top-color: #3c3c3c;
    }
    body[data-ms-theme="dark"] .ms-lang-foot:hover {
        background: rgba(86, 156, 214, 0.15);
        color: #d4d4d4;
    }
    .ms-lang-ico {
        width: 16px;
        height: 16px;
        border-radius: 3px;
        color: #fff;
        font-size: 9px;
        font-weight: 700;
        display: flex;
        align-items: center;
        justify-content: center;
        flex-shrink: 0;
        letter-spacing: -0.3px;
    }
    /* 官方图标(单色路径)用品牌色渲染,替代字母徽标 */
    .ms-lang-ico--svg {
        background: none !important;
        border-radius: 0;
    }
    .ms-lang-ico--svg svg {
        width: 16px;
        height: 16px;
        fill: currentColor;
        display: block;
    }
    body[data-ms-theme="dark"] #ms-lang-suggest {
        background: #252526;
        border-color: #3c3c3c;
        color: #d4d4d4;
        box-shadow: 0 8px 24px rgba(0,0,0,.45);
    }
    body[data-ms-theme="dark"] .ms-lang-item:hover,
    body[data-ms-theme="dark"] .ms-lang-item.is-active {
        background: rgba(86, 156, 214, 0.22);
    }
    /* Typora 风语法色:关键字蓝、函数/类型青绿、字符串红、注释灰。
       阅读态(.vditor-ir .hljs-*)与编辑高亮列(.ms-hi-col)共用一套 */
    .ms-hi-col .hljs-keyword,
    .ms-hi-col .hljs-selector-tag,
    .vditor-ir .hljs-keyword,
    .vditor-ir .hljs-selector-tag { color: #0057d9; }
    .ms-hi-col .hljs-title,
    .ms-hi-col .hljs-title.function_,
    .ms-hi-col .hljs-title.class_,
    .ms-hi-col .hljs-built_in,
    .ms-hi-col .hljs-type,
    .vditor-ir .hljs-title,
    .vditor-ir .hljs-title.function_,
    .vditor-ir .hljs-title.class_,
    .vditor-ir .hljs-built_in,
    .vditor-ir .hljs-type { color: #16825d; }
    .ms-hi-col .hljs-string,
    .ms-hi-col .hljs-attr,
    .vditor-ir .hljs-string,
    .vditor-ir .hljs-attr { color: #b31d28; }
    .ms-hi-col .hljs-number,
    .ms-hi-col .hljs-literal,
    .vditor-ir .hljs-number,
    .vditor-ir .hljs-literal { color: #0550ae; }
    .ms-hi-col .hljs-comment,
    .ms-hi-col .hljs-quote,
    .vditor-ir .hljs-comment,
    .vditor-ir .hljs-quote { color: #6a737d; font-style: italic; }
    .ms-hi-col .hljs-meta,
    .vditor-ir .hljs-meta { color: #6a737d; }
    body[data-ms-theme="dark"] .ms-hi-col .hljs-keyword,
    body[data-ms-theme="dark"] .ms-hi-col .hljs-selector-tag,
    body[data-ms-theme="dark"] .vditor-ir .hljs-keyword,
    body[data-ms-theme="dark"] .vditor-ir .hljs-selector-tag { color: #569cd6; }
    body[data-ms-theme="dark"] .ms-hi-col .hljs-title,
    body[data-ms-theme="dark"] .ms-hi-col .hljs-built_in,
    body[data-ms-theme="dark"] .ms-hi-col .hljs-type,
    body[data-ms-theme="dark"] .vditor-ir .hljs-title,
    body[data-ms-theme="dark"] .vditor-ir .hljs-built_in,
    body[data-ms-theme="dark"] .vditor-ir .hljs-type { color: #4ec9b0; }
    body[data-ms-theme="dark"] .ms-hi-col .hljs-string,
    body[data-ms-theme="dark"] .vditor-ir .hljs-string { color: #ce9178; }
    body[data-ms-theme="dark"] .ms-hi-col .hljs-number,
    body[data-ms-theme="dark"] .ms-hi-col .hljs-literal,
    body[data-ms-theme="dark"] .vditor-ir .hljs-number,
    body[data-ms-theme="dark"] .vditor-ir .hljs-literal { color: #b5cea8; }
    body[data-ms-theme="dark"] .ms-hi-col .hljs-comment,
    body[data-ms-theme="dark"] .vditor-ir .hljs-comment { color: #6a9955; }

    /* 公式块:MarkText figure.mu-math-block 思路 —— 渲染态居中,
       无独立底色(透出编辑器背景,区别于代码块卡片),悬浮浅色提示可点,
       编辑态显示 $$ 源码 */
    .vditor-ir .vditor-ir__node[data-type="math-block"] {
        display: block;
        position: relative;
        margin: 6px 0;
        background: transparent;
        border-radius: 6px;
        overflow: visible;
    }
    .vditor-ir .vditor-ir__node[data-type="math-block"]::before,
    .vditor-ir .vditor-ir__node[data-type="math-block"]::after,
    .vditor-ir .vditor-ir__node--expand[data-type="math-block"]::before,
    .vditor-ir .vditor-ir__node--expand[data-type="math-block"]::after {
        content: none !important;
        display: none !important;
    }
    .vditor-ir .vditor-ir__node[data-type="math-block"] > span[data-type="math-block-open-marker"],
    .vditor-ir .vditor-ir__node[data-type="math-block"] > span[data-type="math-block-close-marker"] {
        display: none !important;
    }
    .vditor-ir .vditor-ir__node:not(.vditor-ir__node--expand)[data-type="math-block"] > pre.vditor-ir__marker--pre {
        display: none !important;
    }
    .vditor-ir .vditor-ir__node[data-type="math-block"] .vditor-ir__preview > .language-math {
        margin: 0 !important;
    }
    /* 行内公式(Typora 式):
       平时 —— 只显示 KaTeX 渲染结果嵌在文字里(藏 $ 标记与源码);
       编辑(光标在公式里,ms-mi-active)—— 源码留在原地,渲染结果以块级
       掉到源码【下方】居中显示(与 Ctrl+Shift+M 的"上源码下预览"同款),
       而不是 Vditor 原生的左右并排。.ms-mi 由 JS 在 decorateMathBlocks 标记 */
    .vditor-ir .ms-mi > .vditor-ir__marker,
    .vditor-ir .ms-mi > .vditor-ir__marker--pre {
        display: none !important;
    }
    .vditor-ir .ms-mi.ms-mi-active > .vditor-ir__marker,
    .vditor-ir .ms-mi.ms-mi-active > .vditor-ir__marker--pre {
        display: inline !important;
    }
    /* 编辑态的渲染结果不进文档流:由下方悬浮气泡承载(#ms-math-pop) */
    .vditor-ir .ms-mi.ms-mi-active > .vditor-ir__preview {
        display: none !important;
    }
    /* 行内公式编辑预览气泡:深色圆角 + 上箭头,跟随源码块下方 */
    #ms-math-pop {
        position: fixed;
        z-index: 90;
        padding: 10px 16px;
        background: #2b2b2b;
        color: #f0f0f0;
        border-radius: 8px;
        box-shadow: 0 6px 22px rgba(0, 0, 0, 0.35);
        pointer-events: none;
        max-width: 70vw;
        overflow: auto;
        font-size: 15px;
    }
    #ms-math-pop::before {
        content: '';
        position: absolute;
        top: -6px;
